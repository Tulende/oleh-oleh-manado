name = "oleh-oleh-manado"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]
workers_dev = true

# Assets untuk Next.js static files
assets = { directory = ".open-next/assets", binding = "ASSETS" }

# Attach the apex domain to this Worker. Cloudflare manages its DNS record and TLS.
[[routes]]
pattern = "oleh-oleh.my.id"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "oleh-oleh-db"
database_id = "1caf4cf9-013a-446f-97cf-0de1d21f1f95"

[vars]
NEXT_PUBLIC_APP_URL = "https://oleh-oleh.my.id"

[ai]
binding = "AI"
